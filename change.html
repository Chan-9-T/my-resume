<!DOCTYPE html>
<html>
<head>
    <title>Change Calculator</title>
</head>

<body>

<h2>Change Calculator</h2>

<label>Enter Amount: </label>
<input type="number" id="amount">
<button onclick="calculate()">Calculate</button>

<h3>Result</h3>
<p id="result"></p>

<!-- Back Button -->
<button onclick="window.location.href='resume.html'">Back</button>

<script>
function calculate() {
    let inputVal = document.getElementById("amount").value;

    // Input Validation
    if (inputVal === "" || isNaN(inputVal) || Number(inputVal) < 0) {
        document.getElementById("result").innerHTML = "Please enter a valid positive amount.";
        return;
    }

    let amount = parseInt(inputVal);
    let notes = [1000, 500, 100, 50, 20, 10, 5, 2, 1];
    let output = "";

    for (let i = 0; i < notes.length; i++) {
        let count = Math.floor(amount / notes[i]);

        if (count > 0) {
            output += "$" + notes[i] + " : " + count + "<br>";
            amount = amount % notes[i];
        }
    }

    document.getElementById("result").innerHTML = output;
}
</script>

</body>
</html>
