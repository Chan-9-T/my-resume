<!DOCTYPE html>
<html>
<head>
    <title>Grading System</title>
</head>
<body>

    <h2>Student Grading System</h2>

    <label>Enter Mark (0-100): </label>
    <input type="number" id="mark" min="0" max="100">

    <button onclick="showGrade()">Show Grade</button>

    <h3 id="result"></h3>

    <!-- Back Button -->
    <button onclick="window.location.href='resume.html'">Back</button>

    <script>
        function showGrade() {
            var inputVal = document.getElementById("mark").value;

            // Input Validation
            if (inputVal === "") {
                document.getElementById("result").innerText = "Please enter a mark.";
                return;
            }

            var mark = Number(inputVal);

            if (isNaN(mark) || mark < 0 || mark > 100) {
                document.getElementById("result").innerText = "Invalid Mark! Please enter a number between 0 and 100.";
                return;
            }

            var grade = "";

            if (mark >= 80) {
                grade = "A";
            } else if (mark >= 70) {
                grade = "B";
            } else if (mark >= 60) {
                grade = "C";
            } else if (mark >= 40) {
                grade = "D";
            } else {
                grade = "F";
            }

            document.getElementById("result").innerText = "Grade: " + grade;
        }
    </script>

</body>
</html>
